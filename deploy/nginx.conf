server {
    listen 80;
    server_name absennow.jaritechnology.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name absennow.jaritechnology.com;

    # SSL (isi setelah certbot/Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/absennow.jaritechnology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/absennow.jaritechnology.com/privkey.pem;

    # ─── Laravel Backend (path /api dan /storage) ────────────────────────────
    root /var/www/absennow/backend/public;

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage {
        alias /var/www/absennow/backend/storage/app/public;
        access_log off;
        expires max;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ─── Angular Frontend (semua path lain) ──────────────────────────────────
    location / {
        root /var/www/absennow/frontend;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Cache aset statik lama
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /var/www/absennow/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Download APK langsung
    location /download/ {
        root /var/www/absennow/frontend;
        add_header Content-Disposition "attachment";
        add_header Content-Type "application/vnd.android.package-archive";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
