server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # ── Laravel API + Sanctum (handled by php-fpm in the `app` container) ──────
    # try_files falls through to /index.php; SCRIPT_FILENAME path is resolved
    # inside the `app` container, so the web image doesn't need the PHP code.
    location ~ ^/(api|sanctum|up) {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Behind a TLS-terminating reverse proxy on the host:
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # ── Uploaded files (shared volume with the app container) ─────────────────
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # ── Frontend SPA (Angular) ────────────────────────────────────────────────
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}
