<div class="sheet-container">
  <div class="drag-indicator-container">
    <div class="drag-indicator"></div>
  </div>

  <div class="sheet-header">
    <div class="title">Tax & Insurance</div>
    <ion-icon name="close-outline" class="close-btn" (click)="dismiss()"></ion-icon>
  </div>

  <div class="sheet-content">
    <div class="list-item">
      <ion-icon name="shield-checkmark-outline" color="primary"></ion-icon>
      <div class="item-content">
        <div class="item-title">Health Insurance</div>
        <div class="item-subtitle">Premium Plan (Group Policy)</div>
      </div>
      <div class="item-amount">$1,200.00</div>
    </div>

    <div class="list-item">
      <ion-icon name="heart-circle-outline" color="primary"></ion-icon>
      <div class="item-content">
        <div class="item-title">Life Insurance</div>
        <div class="item-subtitle">Term Life (5x Annual Salary)</div>
      </div>
      <div class="item-amount">$250.00</div>
    </div>

    <div class="list-item">
      <ion-icon name="business-outline" color="primary"></ion-icon>
      <div class="item-content">
        <div class="item-title">Social Security</div>
        <div class="item-subtitle">Federal Pension Scheme</div>
      </div>
      <div class="item-amount">$200.00</div>
    </div>
  </div>

  <div class="total-row">
    <div class="total-label">Total Tax & Insurance</div>
    <div class="total-amount">$1,250.00</div>
  </div>
</div>
