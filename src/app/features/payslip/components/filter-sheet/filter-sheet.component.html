<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="drag-indicator-container">
      <div class="drag-indicator"></div>
    </div>
    <ion-title>Filter Slip Gaji</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close-outline" color="medium"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Tahun -->
  <div class="filter-section">
    <div class="section-label">Tahun</div>
    <div class="pill-group">
      <div class="pill" [class.active]="selectedYear === '2023'" (click)="setYear('2023')">2023</div>
      <div class="pill" [class.active]="selectedYear === '2024'" (click)="setYear('2024')">2024</div>
      <div class="pill" [class.active]="selectedYear === '2025'" (click)="setYear('2025')">2025</div>
      <div class="pill" [class.active]="selectedYear === '2026'" (click)="setYear('2026')">2026</div>
    </div>
  </div>

  <!-- Status -->
  <div class="filter-section">
    <div class="section-label">Status</div>
    <div class="segmented-control">
      <div class="segment" [class.active]="selectedStatus === 'dibayar'" (click)="setStatus('dibayar')">Dibayar</div>
      <div class="segment" [class.active]="selectedStatus === 'menunggu'" (click)="setStatus('menunggu')">Menunggu</div>
      <div class="segment" [class.active]="selectedStatus === 'diproses'" (click)="setStatus('diproses')">Diproses</div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-content">
    <ion-button expand="block" fill="clear" color="medium" (click)="reset()">
      Reset
    </ion-button>
    <ion-button expand="block" shape="round" color="primary" (click)="apply()">
      Terapkan Filter
    </ion-button>
  </div>
</ion-footer>
