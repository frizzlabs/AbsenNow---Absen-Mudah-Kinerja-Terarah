<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline" color="dark"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Slip Gaji</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openFilter()">
        <ion-icon name="funnel-outline" color="primary"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="text-center" *ngIf="isLoading" style="padding: 40px;">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p style="color: var(--ion-color-medium); margin-top: 12px;">Memuat slip gaji...</p>
  </div>

  <div class="content-wrapper" *ngIf="!isLoading">
    <!-- Latest Payslip Card -->
    <div class="latest-card" *ngIf="latest" (click)="goToDetail(latest.id)">
      <div class="latest-label">Periode Gaji Terbaru</div>
      <div class="latest-period">{{ latest.period_label }}</div>
      <div class="latest-amount-row">
        <div class="amount">{{ fmt(latest.net_salary) }}</div>
        <div class="paid-badge" *ngIf="latest.status === 'dibayar'">
          <ion-icon name="checkmark-circle"></ion-icon>
          <span>Dibayar</span>
        </div>
      </div>
    </div>

    <!-- Empty -->
    <div *ngIf="!latest" style="padding: 40px; text-align: center; color: var(--ion-color-medium);">
      <ion-icon name="document-text-outline" style="font-size: 36px;"></ion-icon>
      <p>Belum ada slip gaji.</p>
    </div>

    <!-- History Section -->
    <div class="section-title" *ngIf="history.length">RIWAYAT</div>

    <div class="history-list">
      <div class="history-card" *ngFor="let p of history" (click)="goToDetail(p.id)">
        <div class="icon-container" [ngClass]="isBonus(p) ? 'warning-light' : 'primary-light'">
          <ion-icon [name]="isBonus(p) ? 'gift-outline' : 'document-text-outline'" [color]="isBonus(p) ? 'warning' : 'primary'"></ion-icon>
        </div>
        <div class="card-content">
          <div class="title-row">
            <span class="month">{{ p.period_label }}</span>
            <span class="amount">{{ fmt(p.net_salary) }}</span>
          </div>
          <div class="subtitle-row">
            <span class="paid-date">{{ formatPaidDate(p.paid_date) }}</span>
            <span class="status-text success">{{ statusLabel(p.status) }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
