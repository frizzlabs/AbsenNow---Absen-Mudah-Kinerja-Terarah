<app-bottom-nav></app-bottom-nav>
<ion-content>
  <app-page-header title="Slip Gaji"></app-page-header>

  <div class="content-wrapper">
    <div *ngIf="isLoading" style="display:flex;justify-content:center;padding:48px 0">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>

    <ng-container *ngIf="!isLoading">
      <div *ngIf="payslips.length === 0" style="text-align:center;color:#98A2B3;padding:48px 0;font-size:14px">
        Belum ada slip gaji
      </div>

      <ng-container *ngIf="latest">
        <div class="latest-card" (click)="goToDetail(latest.id)">
          <div class="latest-label">Periode Gaji Terakhir</div>
          <div class="latest-period">{{ formatPeriod(latest) }}</div>
          <div class="latest-amount-row">
            <div class="amount">{{ fmt(latest.net_salary) }}</div>
            <div class="paid-badge">
              <ion-icon [name]="latest.status === 'dibayar' ? 'checkmark-circle' : 'time-outline'"></ion-icon>
              <span>{{ statusLabel(latest.status) }}</span>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="history.length > 0">
        <div class="section-title">RIWAYAT</div>
        <div class="history-list">
          <div class="history-card" *ngFor="let p of history" (click)="goToDetail(p.id)">
            <div [class]="isBonus(p) ? 'icon-container warning-light' : 'icon-container primary-light'">
              <ion-icon [name]="isBonus(p) ? 'gift-outline' : 'document-text-outline'" [color]="isBonus(p) ? 'warning' : 'primary'"></ion-icon>
            </div>
            <div class="card-content">
              <div class="title-row">
                <span class="month">{{ p.period_label }}</span>
                <span class="amount">{{ fmt(p.net_salary) }}</span>
              </div>
              <div class="subtitle-row">
                <span class="paid-date">{{ formatPaidDate(p.paid_date) }}</span>
                <span class="status-text" [class.success]="p.status === 'dibayar'" [class.warning]="p.status !== 'dibayar'">{{ statusLabel(p.status) }}</span>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>
</ion-content>
