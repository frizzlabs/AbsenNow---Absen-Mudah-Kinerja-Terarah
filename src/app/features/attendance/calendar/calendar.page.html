<ion-content [fullscreen]="true" class="bg-light">
  <app-page-header title="Absensi"></app-page-header>
  
  <div class="stepper-section">
    <div class="stepper-labels">
      <span class="step-text text-blue">Langkah 1 dari 3</span>
      <span class="progress-text text-gray">Proses Koreksi</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" style="width: 33%"></div>
    </div>
  </div>
  
  <div class="divider-full"></div>

  <div class="page-container">
    <div class="legend">
      <div class="legend-item"><div class="dot blue"></div>Hadir</div>
      <div class="legend-item"><div class="dot red"></div>Absen</div>
      <div class="legend-item"><div class="dot yellow"></div>Hari Libur</div>
    </div>

    <app-calendar-widget></app-calendar-widget>

    <h3 class="section-title text-h5">Ringkasan Harian</h3>
    
    <div class="summary-card">
      <div class="card-header">
        <div class="date-info">
          <span class="date-str">Senin, 12 Feb</span>
          <span class="shift-str">Shift Reguler</span>
        </div>
        <div class="badge-present">HADIR</div>
      </div>
      
      <div class="time-cards">
        <div class="time-card">
          <div class="label"><ion-icon name="log-in-outline" class="green"></ion-icon> MASUK</div>
          <div class="time">08:32 WIB</div>
          <div class="sub">Tepat Waktu</div>
        </div>
        <div class="time-card">
          <div class="label"><ion-icon name="log-out-outline" class="red"></ion-icon> KELUAR</div>
          <div class="time">17:00 WIB</div>
          <div class="sub">Bekerja 8 jam 15 mnt</div>
        </div>
      </div>
      
      <div class="card-divider"></div>
      
      <div class="card-footer">
        <div class="approver">
          <div class="avatar-placeholder"></div>
          <span>Disetujui oleh Manajer</span>
        </div>
        <a routerLink="/attendance/correction/reason" class="details-link">Detail <ion-icon name="chevron-forward-outline"></ion-icon></a>
      </div>
    </div>
  </div>
</ion-content>
