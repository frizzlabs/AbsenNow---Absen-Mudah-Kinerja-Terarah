<ion-content [fullscreen]="true">
  <app-page-header title="QR Identity Validation"></app-page-header>
  
  <div class="page-container">
    <div class="status-badge-container">
      <div class="status-badge active">
        <div class="dot"></div>
        <span>SCANNER ACTIVE</span>
      </div>
    </div>

    <app-camera-frame type="qr"></app-camera-frame>

    <div class="text-center info-text">
      <h2 class="text-h5">Scan QR Code</h2>
      <p class="text-body-medium-regular text-medium">
        Align the company QR code within the frame to automatically verify your attendance.
      </p>
    </div>

    <div class="segmented-control">
      <div class="segment" routerLink="/attendance/face-validation">
        <ion-icon name="person-outline"></ion-icon>
        <span>Face</span>
      </div>
      <div class="segment active">
        <ion-icon name="qr-code-outline"></ion-icon>
        <span>QR Code</span>
      </div>
    </div>

    <div class="security-badge text-body-xsmall-semibold">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <span>SECURED BY KARAJO ID</span>
    </div>
  </div>
</ion-content>
