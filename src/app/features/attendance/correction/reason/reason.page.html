<ion-content [fullscreen]="true" class="bg-light">
  <app-page-header title="Koreksi Absensi"></app-page-header>

  <div class="stepper-section">
    <div class="stepper-labels">
      <span class="step-text text-blue">Langkah 1 dari 3</span>
      <span class="progress-text text-gray">Progress Pengajuan</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: 33%"></div></div>
  </div>

  <div class="divider-full"></div>

  <div class="page-container">
    <h2 class="text-h4 title-spacing">Mengapa Anda mengajukan koreksi?</h2>
    <p class="text-body-medium-regular subtitle-spacing">Pilih jenis koreksi dan tanggal absensi yang perlu diperbaiki.</p>

    <label class="section-label">TANGGAL ABSENSI</label>
    <div class="date-input-box">
      <ion-icon name="calendar-outline"></ion-icon>
      <input type="date" [(ngModel)]="draft.date" [max]="maxDate" />
    </div>

    <label class="section-label" style="margin-top: 24px;">JENIS KOREKSI</label>

    <div class="radio-list">
      <div class="radio-item" *ngFor="let t of types"
           [class.active]="draft.correctionType === t.value"
           (click)="draft.correctionType = t.value">
        <div class="radio-circle">
          <div class="inner" *ngIf="draft.correctionType === t.value"></div>
        </div>
        <ion-icon [name]="t.icon" class="type-icon"></ion-icon>
        <span>{{ t.label }}</span>
      </div>
    </div>

    <div class="info-box">
      <ion-icon name="information-circle-outline"></ion-icon>
      <p>Pengajuan koreksi akan diteruskan ke atasan langsung untuk persetujuan. Pastikan data yang diisi akurat.</p>
    </div>
  </div>

  <div class="fixed-bottom">
    <app-button variant="primary" styleClass="w-full" (onClick)="goNext()" [disabled]="!draft.date || !draft.correctionType">
      Lanjut
    </app-button>
  </div>
</ion-content>
