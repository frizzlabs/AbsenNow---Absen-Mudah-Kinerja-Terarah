<ion-content [fullscreen]="true" class="bg-light">
  <app-page-header title="Koreksi Absensi"></app-page-header>

  <div class="stepper-section">
    <div class="stepper-labels">
      <span class="step-text text-blue">Langkah 2 dari 3</span>
      <span class="progress-text text-gray">Progress Pengajuan</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: 66%"></div></div>
  </div>
  <div class="divider-full"></div>

  <div class="page-container">

    <!-- Info tanggal & jenis -->
    <div class="summary-card">
      <div class="card-header">
        <span class="label">DETAIL KOREKSI</span>
      </div>
      <div class="info-row">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>{{ dateFormatted }}</span>
      </div>
      <div class="info-row">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ typeLabelFormatted }}</span>
      </div>
    </div>

    <div class="form-section">

      <!-- Jam absen masuk (jika dibutuhkan) -->
      <div class="form-group" *ngIf="needsCheckin">
        <label>Jam Absen Masuk yang Diusulkan *</label>
        <div class="input-box">
          <ion-icon name="log-in-outline" class="gray-icon"></ion-icon>
          <input type="time" [(ngModel)]="draft.proposedCheckin" />
        </div>
      </div>

      <!-- Jam absen pulang (jika dibutuhkan) -->
      <div class="form-group" *ngIf="needsCheckout">
        <label>Jam Absen Pulang yang Diusulkan *</label>
        <div class="input-box">
          <ion-icon name="log-out-outline" class="gray-icon"></ion-icon>
          <input type="time" [(ngModel)]="draft.proposedCheckout" />
        </div>
      </div>

      <!-- Alasan -->
      <div class="form-group">
        <label>Alasan / Keterangan *</label>
        <div class="textarea-box">
          <textarea
            placeholder="Jelaskan alasan pengajuan koreksi secara detail (min. 10 karakter)..."
            [(ngModel)]="draft.justification"
            maxlength="500"
            rows="4">
          </textarea>
          <div class="textarea-footer">
            <span class="char-count" [class.limit]="charCount >= 450">{{ charCount }}/500</span>
          </div>
        </div>
      </div>

      <!-- Upload bukti -->
      <div class="form-group">
        <label>Bukti Pendukung <span class="optional">(opsional)</span></label>

        <div class="evidence-preview" *ngIf="draft.evidencePreview">
          <img [src]="draft.evidencePreview" alt="Bukti" />
          <button class="remove-btn" (click)="removeEvidence()">
            <ion-icon name="close-circle"></ion-icon>
          </button>
        </div>

        <div class="file-name-box" *ngIf="draft.evidenceFile && !draft.evidencePreview">
          <ion-icon name="document-outline"></ion-icon>
          <span>{{ draft.evidenceFile.name }}</span>
          <button (click)="removeEvidence()"><ion-icon name="close-circle-outline"></ion-icon></button>
        </div>

        <label class="upload-btn" *ngIf="!draft.evidenceFile">
          <ion-icon name="cloud-upload-outline"></ion-icon>
          <span>Pilih file (JPG/PNG/PDF, maks 5MB)</span>
          <input type="file" accept="image/jpeg,image/png,application/pdf" (change)="onFileChange($event)" style="display:none" />
        </label>
      </div>

      <p class="help-text">Pengajuan ini akan dikirim ke atasan untuk ditinjau dan disetujui.</p>
    </div>
  </div>

  <div class="fixed-bottom">
    <app-button variant="primary" styleClass="w-full" (onClick)="goNext()" [disabled]="!isValid">
      Tinjau Pengajuan
    </app-button>
  </div>
</ion-content>
