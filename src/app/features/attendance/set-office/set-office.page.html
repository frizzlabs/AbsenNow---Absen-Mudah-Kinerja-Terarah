<ion-content [fullscreen]="true" class="bg-light">
  <app-page-header title="Atur Lokasi Kantor"></app-page-header>

  <div class="page-container">

    <!-- MAP SECTION -->
    <div class="section-card">
      <div class="section-title">
        <ion-icon name="location-outline"></ion-icon>
        <span>Lokasi Kantor</span>
      </div>

      <!-- SEARCH BOX -->
      <div class="search-wrap">
        <div class="search-box">
          <ion-icon name="search-outline" class="search-icon"></ion-icon>
          <input
            class="search-input"
            type="text"
            placeholder="Cari lokasi kantor..."
            [(ngModel)]="searchQuery"
            (input)="onSearchInput()"
            (blur)="closeSearch()"
          />
          <ion-spinner *ngIf="isSearching" name="crescent" class="search-spinner"></ion-spinner>
        </div>
        <div class="search-results" *ngIf="showResults && searchResults.length > 0">
          <button
            class="result-item"
            *ngFor="let r of searchResults"
            (mousedown)="selectResult(r)"
          >
            <ion-icon name="location-outline" class="result-icon"></ion-icon>
            <span class="result-text">{{ r.display_name }}</span>
          </button>
        </div>
      </div>

      <div id="set-office-map" class="map-box"></div>
      <p class="address-text" [class.geocoding]="isGeocoding" *ngIf="address">{{ address }}</p>

      <button class="location-btn" [disabled]="isFetchingLocation" (click)="useMyLocation()">
        <ion-spinner *ngIf="isFetchingLocation" name="crescent" class="location-spinner"></ion-spinner>
        <ion-icon *ngIf="!isFetchingLocation" name="navigate-outline"></ion-icon>
        <span>{{ isFetchingLocation ? 'Mencari Lokasi...' : 'Gunakan Lokasi Saya' }}</span>
      </button>

      <div class="field-group">
        <label class="field-label">Nama Kantor</label>
        <input class="field-input" type="text" placeholder="cth. Kantor Pusat"
               [(ngModel)]="officeName" />
      </div>

      <div class="field-group">
        <label class="field-label">Radius Geofence</label>
        <div class="radius-chips">
          <button *ngFor="let r of radiusOptions"
                  class="chip"
                  [class.active]="radius === r"
                  (click)="selectRadius(r)">{{ r }}m</button>
        </div>
      </div>
    </div>

    <!-- WORK SCHEDULE SECTION -->
    <div class="section-card">
      <div class="section-title">
        <ion-icon name="time-outline"></ion-icon>
        <span>Jadwal Kerja</span>
      </div>

      <div class="schedule-row">
        <div class="field-group">
          <label class="field-label">Jam Masuk</label>
          <input class="field-input" type="time" [(ngModel)]="workStart" />
        </div>
        <div class="field-group">
          <label class="field-label">Jam Keluar</label>
          <input class="field-input" type="time" [(ngModel)]="workEnd" />
        </div>
      </div>
      <p class="schedule-hint" *ngIf="workStart && workEnd && workStart >= workEnd">
        <ion-icon name="warning-outline"></ion-icon>
        Jam masuk harus lebih awal dari jam keluar.
      </p>
    </div>

    <div class="bottom-actions">
      <ion-button expand="block" shape="round" color="primary" [disabled]="isSaving" (click)="save()">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        {{ isSaving ? 'Menyimpan...' : 'SIMPAN PENGATURAN KANTOR' }}
      </ion-button>
    </div>

  </div>
</ion-content>
