<app-bottom-nav></app-bottom-nav>
<ion-content>
  <app-page-header title="Ajukan Lembur"></app-page-header>

  <app-overtime-stepper [currentStep]="1"></app-overtime-stepper>

  <div class="content-wrapper">

    <div class="input-group">
      <label>Judul / Deskripsi Pekerjaan</label>
      <input class="field-input" type="text" placeholder="cth. Finalisasi laporan Q3" [(ngModel)]="title" />
    </div>

    <div class="input-group mt-24">
      <label>Tanggal Lembur</label>
      <input class="field-input" type="date" [(ngModel)]="overtimeDate" />
    </div>

    <div class="time-row">
      <div class="input-group">
        <label>Waktu Mulai</label>
        <input class="field-input" type="time" [(ngModel)]="startTime" />
      </div>
      <div class="input-group">
        <label>Waktu Selesai</label>
        <input class="field-input" type="time" [(ngModel)]="endTime" />
      </div>
    </div>

    <div class="duration-info" *ngIf="startTime && endTime && endTime > startTime">
      <ion-icon name="timer-outline"></ion-icon>
      <span>Durasi: <strong>{{ calcDuration() }}</strong></span>
    </div>

    <div class="input-group mt-24">
      <label>Alasan</label>
      <div class="textarea-box">
        <textarea placeholder="Tambahkan rincian atau catatan tentang sesi kerja ini..." [(ngModel)]="reason" maxlength="200"></textarea>
        <div class="char-count">{{ reason.length }}/200</div>
      </div>
    </div>

    <div class="input-group mt-24">
      <label>Lampiran (Opsional)</label>
      <input type="file" #fileInput style="display: none;" accept="image/*,application/pdf" (change)="onFileSelected($event)" />

      <div class="upload-box" *ngIf="!fileName" (click)="triggerFileInput(fileInput)">
        <div class="upload-icon-circle">
          <ion-icon name="cloud-upload-outline" color="primary"></ion-icon>
        </div>
        <div class="upload-text">Klik untuk mengunggah</div>
        <div class="upload-hint">PDF, JPG atau PNG (MAKS. 5MB)</div>
      </div>

      <div class="uploaded-file" *ngIf="fileName">
        <div class="file-icon">
          <ion-icon name="document-text-outline"></ion-icon>
        </div>
        <div class="file-info">
          <div class="file-name">{{ fileName }}</div>
          <div class="file-size" *ngIf="fileSizeText">{{ fileSizeText }}</div>
        </div>
        <button class="file-remove" (click)="removeFile()">
          <ion-icon name="trash-outline"></ion-icon>
        </button>
      </div>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-wrapper">
    <ion-button expand="block" shape="round" color="primary" (click)="continue()">
      Lanjutkan
    </ion-button>
  </div>
</ion-footer>
