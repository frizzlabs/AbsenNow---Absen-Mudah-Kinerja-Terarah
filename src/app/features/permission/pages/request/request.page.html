<ion-content>
  <app-page-header title="Ajukan Izin"></app-page-header>

  <div class="progress-container">
    <div class="progress-labels">
      <span class="step-label">Langkah 1 dari 2</span>
      <span class="title-label">Ajukan Izin</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" style="width: 50%"></div>
    </div>
  </div>

  <div class="content-wrapper">
    <!-- Inputs for Purpose & Category -->
    <div class="input-group">
      <label>Keperluan / Judul</label>
      <div class="input-box">
        <input type="text" [(ngModel)]="title" placeholder="mis. Janji Temu Dokter" style="width: 100%; border: none; outline: none; background: transparent; font-size: 14px; color: var(--ion-color-dark);">
      </div>
    </div>

    <div class="input-group mt-16" style="margin-top: 16px;">
      <label>Kategori</label>
      <div class="input-box">
        <select [(ngModel)]="category" style="width: 100%; border: none; outline: none; background: transparent; font-size: 14px; color: var(--ion-color-dark);">
          <option value="personal">Izin Pribadi</option>
          <option value="family">Darurat Keluarga</option>
          <option value="emergency">Darurat Rumah</option>
          <option value="other">Lainnya</option>
        </select>
      </div>
    </div>

    <!-- Date Picker Input -->
    <div class="input-group mt-16" style="margin-top: 16px;">
      <label>Tanggal</label>
      <div class="input-box">
        <input type="date" [(ngModel)]="permissionDate" style="width: 100%; border: none; outline: none; background: transparent; font-size: 14px; color: var(--ion-color-dark);">
      </div>
    </div>

    <div class="time-row" style="margin-top: 16px;">
      <div class="input-group">
        <label>Waktu Mulai</label>
        <div class="input-box">
          <input type="time" [(ngModel)]="startTime" style="width: 100%; border: none; outline: none; background: transparent; font-size: 14px; color: var(--ion-color-dark);">
        </div>
      </div>
      <div class="input-group">
        <label>Waktu Selesai</label>
        <div class="input-box">
          <input type="time" [(ngModel)]="endTime" style="width: 100%; border: none; outline: none; background: transparent; font-size: 14px; color: var(--ion-color-dark);">
        </div>
      </div>
    </div>

    <div class="input-group mt-24">
      <label>Alasan / Catatan</label>
      <div class="textarea-box">
        <textarea [(ngModel)]="notes" maxlength="200" placeholder="Tambahkan rincian atau catatan tentang pengajuan izin ini..."></textarea>
        <div class="char-count">{{ notes?.length || 0 }}/200</div>
      </div>
    </div>

    <div class="input-group mt-24">
      <label>Lampiran (Opsional)</label>
      <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;" accept="image/*,application/pdf">
      
      <!-- Upload Box -->
      <div class="upload-box" *ngIf="!fileName" (click)="triggerFileInput(fileInput)" style="cursor: pointer;">
        <div class="upload-icon-circle">
          <ion-icon name="cloud-upload-outline" color="primary"></ion-icon>
        </div>
        <div class="upload-text">Klik untuk mengunggah</div>
        <div class="upload-hint">PDF, JPG atau PNG (MAKS. 5MB)</div>
      </div>

      <!-- Attachment Preview Card -->
      <div class="attachment-card-preview" *ngIf="fileName" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; margin-top: 8px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <ion-icon name="document-text-outline" color="primary" style="font-size: 24px;"></ion-icon>
          <div>
            <div style="font-size: 14px; font-weight: 500; color: var(--ion-color-dark);">{{ fileName }}</div>
            <div style="font-size: 12px; color: var(--ion-color-medium);">{{ fileSizeText }}</div>
          </div>
        </div>
        <ion-button fill="clear" color="danger" (click)="removeFile()" style="margin: 0; --padding-start: 4px; --padding-end: 4px;">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-wrapper">
    <ion-button expand="block" shape="round" color="primary" (click)="continue()">
      Lanjutkan
    </ion-button>
  </div>
</ion-footer>
