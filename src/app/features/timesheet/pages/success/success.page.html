<app-bottom-nav></app-bottom-nav>
<ion-content class="ion-padding">
  <div class="success-container">
    <div class="success-icon-wrapper">
      <div class="success-icon-bg"></div>
      <div class="success-icon">
        <ion-icon name="checkmark-outline"></ion-icon>
      </div>
    </div>

    <h1 class="success-title">Timesheet Berhasil Dikirim</h1>
    <p class="success-message">
      Timesheet Anda untuk <strong>{{ rangeLabel }}</strong> telah diteruskan untuk persetujuan.
    </p>

    <div class="hours-card">
      <div class="card-label">Total Jam Tercatat</div>
      <div class="card-value">
        <span class="big-num">{{ totalLabel }}</span>
        <span class="unit">jam</span>
      </div>
    </div>

    <div class="status-badge pending">
      <div class="dot warning"></div>
      Menunggu Persetujuan
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-wrapper">
    <ion-button expand="block" color="primary" class="primary-btn" (click)="backToActivity()">
      Kembali ke Aktivitas
    </ion-button>
    <ion-button expand="block" fill="outline" color="primary" class="outline-btn" (click)="goToApproval()">
      Lihat Status Persetujuan
    </ion-button>
  </div>
</ion-footer>
