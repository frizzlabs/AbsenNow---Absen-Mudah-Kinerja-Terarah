<app-bottom-nav></app-bottom-nav>
<ion-content [fullscreen]="true" class="bg-light">
  <app-page-header title="Verifikasi Identitas"></app-page-header>

  <div class="page-container" *ngIf="!isLoading">
    <div class="status-card">
      <div class="status-icon-wrap">
        <ion-icon name="shield-outline"></ion-icon>
      </div>
      <h2>Identitas Belum Diverifikasi</h2>
      <p>Upload foto KTP atau Paspor kamu untuk melengkapi profil dan mengakses semua fitur.</p>
    </div>

    <app-section-card iconName="card-outline" title="Informasi Identitas" badgeText="Belum ada data">
      <div class="empty-row">
        <span class="label">Jenis ID</span><span class="value">-</span>
      </div>
      <div class="empty-row">
        <span class="label">Nomor ID</span><span class="value">-</span>
      </div>
      <div class="empty-row">
        <span class="label">Nama di ID</span><span class="value">-</span>
      </div>
    </app-section-card>
  </div>

  <div class="center-spinner" *ngIf="isLoading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <div class="fixed-bottom" *ngIf="!isLoading">
    <app-button variant="primary" styleClass="w-full" routerLink="/profile/identity/form">
      <ion-icon name="shield-checkmark-outline" slot="start" style="margin-right:8px;font-size:20px;"></ion-icon>
      Verifikasi Sekarang
    </app-button>
  </div>
</ion-content>
