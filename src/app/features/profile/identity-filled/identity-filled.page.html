<ion-content [fullscreen]="true" class="bg-light">
  <app-page-header title="Identity Verification"></app-page-header>
  
  <div class="page-container">
    
    <app-section-card iconName="image-outline" title="Contact Information" [showDivider]="false">
      <app-upload-box 
        status="filled" 
        fileName="Receipt_The Corner Bistro.jpg"
        fileSize="1.2 MB"
        helperText="National ID Card • Front Side">
      </app-upload-box>
    </app-section-card>
    
    <app-section-card iconName="card-outline" title="Identity Information">
      <div class="info-box">
        <ion-icon name="information-circle-outline"></ion-icon>
        <p>Please review the extracted information carefully to ensure accuracy.</p>
      </div>
      
      <div class="form-group">
        <label>ID Type</label>
        <div class="select-box filled">
          <span class="value">National ID Card</span>
          <ion-icon name="chevron-down-outline" class="chevron"></ion-icon>
        </div>
      </div>
      
      <div class="form-group">
        <label>ID Number</label>
        <app-input placeholder="-" [value]="'3892-1029-9012'"></app-input>
      </div>
      
      <div class="form-group">
        <label>Full Name</label>
        <app-input placeholder="-" [value]="'Sarah Miller'"></app-input>
      </div>
      
      <div class="form-row-2col">
        <div class="form-group">
          <label>Expiry Date</label>
          <app-input placeholder="-" [value]="'12 Jan 2030'"></app-input>
        </div>
        <div class="form-group">
          <label>Last Updated</label>
          <app-input placeholder="-" [value]="'24 Feb 2023'"></app-input>
        </div>
      </div>
    </app-section-card>

  </div>
  
  <div class="fixed-bottom">
    <app-button variant="primary" styleClass="w-full mb-12" routerLink="/profile/identity/confirmed">
      <ion-icon name="paper-plane-outline" slot="start" style="margin-right: 8px; font-size: 20px;"></ion-icon>
      Confirm & Submit
    </app-button>
    
    <app-button variant="outline" styleClass="w-full" routerLink="/profile/identity/form">
      <ion-icon name="camera-outline" slot="start" style="margin-right: 8px; font-size: 20px;"></ion-icon>
      Retake Photo
    </app-button>
  </div>
</ion-content>
