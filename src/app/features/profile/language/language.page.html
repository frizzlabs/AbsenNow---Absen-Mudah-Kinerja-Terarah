<app-bottom-nav></app-bottom-nav>
<ion-content [fullscreen]="true" class="bg-light">
  <div class="profile-header">
    <ion-icon name="arrow-back-outline" class="back-btn" routerLink="/profile"></ion-icon>
    <h1 class="page-title">{{ 'profile.language.title' | translate }}</h1>
  </div>
  
  <div class="page-container">
    <div class="language-card">
      <div 
        class="lang-item" 
        *ngFor="let lang of languages" 
        (click)="selectLanguage(lang.code)"
        [class.selected]="languageService.getCurrentLanguage() === lang.code">
        
        <span class="lang-name">{{ lang.name }}</span>
        
        <ion-icon 
          name="checkmark-circle" 
          class="check-icon" 
          *ngIf="languageService.getCurrentLanguage() === lang.code">
        </ion-icon>
      </div>
    </div>
  </div>
</ion-content>
