<app-bottom-nav></app-bottom-nav>
<ion-content [fullscreen]="true" class="bg-light">
  <app-page-header title="Identity Verification"></app-page-header>
  
  <div class="page-container">
    
    <app-verification-status 
      status="confirmed" 
      title="Identity Confirmed" 
      description="Your identity has been successfully verified for employment purposes.">
    </app-verification-status>
    
    <app-section-card iconName="id-card-outline" title="Identity Information" badgeText="Read-only">
      <div class="form-group">
        <label>ID Type</label>
        <div class="disabled-box with-icon">
          <span>National ID Card</span>
          <ion-icon name="card-outline"></ion-icon>
        </div>
      </div>
      
      <div class="form-group">
        <label>ID Number</label>
        <div class="disabled-box">****_****-9012</div>
      </div>
      
      <div class="form-row-2col">
        <div class="form-group">
          <label>Expiry Date</label>
          <div class="disabled-box">12 Jan 2030</div>
        </div>
        <div class="form-group">
          <label>Last Updated</label>
          <div class="disabled-box">24 Feb 2023</div>
        </div>
      </div>
    </app-section-card>

  </div>
  
  <div class="fixed-bottom">
    <app-button variant="outline" styleClass="w-full" routerLink="/profile/identity/form">
      <ion-icon name="shield-checkmark-outline" slot="start" style="margin-right: 8px; font-size: 20px;"></ion-icon>
      Re-verify Identity
    </app-button>
  </div>
</ion-content>
