<app-bottom-nav></app-bottom-nav>
<ion-content [fullscreen]="true" class="bg-light">
  <app-page-header title="Edit Personal Information"></app-page-header>

  <div class="page-container">

    <!-- FOTO PROFIL -->
    <app-section-card iconName="person-outline" title="Foto Profil">
      <div class="photo-area" (click)="fileInput.click()">
        <div class="avatar-wrap">
          <img [src]="previewUrl || user?.avatar_url || 'assets/images/avatar-placeholder.png'" alt="Foto Profil" class="avatar-img" />
          <div class="avatar-overlay">
            <ion-icon name="camera-outline"></ion-icon>
          </div>
        </div>
        <div class="photo-meta">
          <span class="photo-hint">Tap foto untuk mengganti</span>
          <span class="photo-sub">JPG, PNG, WebP · Maks 4 MB</span>
        </div>
        <ion-spinner *ngIf="isUploading" name="crescent" class="upload-spinner"></ion-spinner>
      </div>
      <input #fileInput type="file" accept="image/jpeg,image/png,image/webp" style="display:none" (change)="onFileSelected($event)" />
    </app-section-card>

    <!-- BASIC INFO (read-only) -->
    <app-section-card iconName="id-card-outline" title="Basic Information" badgeText="Read-only">
      <div class="info-group">
        <span class="label">Full Name</span>
        <span class="value">{{ user?.name || '-' }}</span>
      </div>
      <div class="info-row-2col">
        <div class="info-group">
          <span class="label">Date of Birth</span>
          <span class="value">{{ dobLabel }}</span>
        </div>
        <div class="info-group">
          <span class="label">Gender</span>
          <span class="value">{{ user?.gender || '-' }}</span>
        </div>
      </div>
    </app-section-card>

    <!-- CONTACT INFO (editable) -->
    <app-section-card iconName="call-outline" title="Contact Information">
      <div class="form-group">
        <label>Phone Number</label>
        <app-input placeholder="cth. +62 812-3456-7890" [(value)]="model.phone"></app-input>
      </div>
      <div class="form-group">
        <label>Personal Email</label>
        <app-input type="email" placeholder="Personal Email" [(value)]="model.personal_email"></app-input>
      </div>
      <div class="form-group">
        <label>Residential Address</label>
        <div class="textarea-box">
          <textarea rows="3" maxlength="200" [(ngModel)]="model.address" placeholder="Alamat tempat tinggal"></textarea>
          <div class="textarea-footer">
            <span class="char-count">{{ model.address.length }}/200</span>
          </div>
        </div>
      </div>
    </app-section-card>

    <!-- EMERGENCY CONTACT (editable) -->
    <app-section-card iconName="medkit-outline" title="Emergency Contact">
      <div class="form-group">
        <label>Contact Name</label>
        <app-input placeholder="Contact Name" [(value)]="model.emergency_contact_name"></app-input>
      </div>
      <div class="form-group" style="position: relative;">
        <label>Relationship</label>
        <div (click)="showRelationshipDropdown = !showRelationshipDropdown" class="select-box" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: white;">
          <span style="font-size: 14px; color: var(--ion-color-dark);">{{ relationshipLabel }}</span>
          <ion-icon name="chevron-down-outline" style="color: #98A2B3; font-size: 18px;"></ion-icon>
        </div>

        <div *ngIf="showRelationshipDropdown" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #D0D5DD; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); z-index: 9999; margin-top: 4px; overflow: hidden; padding: 4px 0;">
          <div class="dropdown-item" (click)="selectRelationship('')">Pilih hubungan...</div>
          <div class="dropdown-item" *ngFor="let r of relationshipOptions" (click)="selectRelationship(r)">
            {{ r }}
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <app-input placeholder="cth. +62 813-9876-5432" [(value)]="model.emergency_contact_phone"></app-input>
      </div>
    </app-section-card>

  </div>

  <div class="fixed-bottom">
    <app-button variant="primary" styleClass="w-full mb-12" (click)="save()" [disabled]="isSaving">
      {{ isSaving ? 'Menyimpan...' : 'Save Changes' }}
    </app-button>
    <app-button variant="outline" styleClass="w-full" (click)="cancel()">Cancel</app-button>
  </div>
</ion-content>
