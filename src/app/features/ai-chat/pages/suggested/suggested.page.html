<app-bottom-nav></app-bottom-nav>
<ion-content class="ai-chat-content" [fullscreen]="true">
  <app-page-header title="KarajoAI" [showBack]="true"></app-page-header>

  <div class="chat-container">
    
    <div class="time-divider">
      <span class="pill">Today, 09:30 WIB</span>
    </div>

    <!-- User Message -->
    <div class="message user-message">
      <div class="bubble">
        Hi, could you please show me my current leave balance?
      </div>
    </div>
    <div class="message-time right">09:32 WIB</div>

    <!-- AI Message -->
    <div class="message ai-message">
      <p class="text-content">Certainly. Here is a summary of your current leave balance as of today:</p>
      
      <div class="data-table">
        <div class="table-header">
          <span>Type</span>
          <span>Available</span>
        </div>
        <div class="table-row">
          <span>Annual Leave</span>
          <span class="text-blue">12 Days</span>
        </div>
        <div class="table-row">
          <span>Sick Leave</span>
          <span class="text-green">5 Days</span>
        </div>
        <div class="table-row">
          <span>Personal Leave</span>
          <span class="text-dark">2 Days</span>
        </div>
      </div>
      
      <div class="table-divider"></div>
      
      <p class="text-content mt-16">Would you like to apply for leave now?</p>
      
      <div class="action-chips">
        <button class="chip" routerLink="/ai-chat/document">Leave Request Policy</button>
        <button class="chip">Apply for Leave</button>
        <button class="chip">View History</button>
      </div>
    </div>

  </div>

  <div style="height: 100px;"></div>

  <!-- Bottom Input area fixed to viewport -->
  <div class="input-area-fixed">
    <div class="chat-input-wrapper">
      <ion-icon name="sparkles" class="sparkle-icon"></ion-icon>
      <input type="text" placeholder="Ask me about work..." />
    </div>
  </div>

</ion-content>
