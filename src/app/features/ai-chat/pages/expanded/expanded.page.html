<ion-content class="ai-chat-content" [fullscreen]="true">
  <app-page-header title="KarajoAI" [showBack]="true"></app-page-header>

  <div class="logo-area">
    <div class="logo-wrapper">
      <div class="logo-icon">
        <span class="k-letter">K</span>
      </div>
      <span class="logo-text">KarajoAI</span>
    </div>
    <h2 class="subtitle">How can I help you today?</h2>
  </div>

  <div class="categories-scroll">
    <div class="category-pill active">My HR</div>
    <div class="category-pill">Policies</div>
    <div class="category-pill">Benefits</div>
    <div class="category-pill">Career</div>
  </div>

  <div class="suggestions-grid">
    <!-- Card 1 -->
    <div class="suggestion-card">
      <ion-icon name="calendar-outline" class="text-blue"></ion-icon>
      <h3>Remaining leave</h3>
      <p>Check remaining days</p>
    </div>
    
    <!-- Card 2 -->
    <div class="suggestion-card">
      <ion-icon name="receipt-outline" class="text-blue"></ion-icon>
      <h3>Last payslip</h3>
      <p>Last 3 months info</p>
    </div>
    
    <!-- Card 3 -->
    <div class="suggestion-card">
      <ion-icon name="laptop-outline" class="text-blue"></ion-icon>
      <h3>Remote policy</h3>
      <p>Direct reporting line</p>
    </div>
    
    <!-- Card 4 -->
    <div class="suggestion-card">
      <ion-icon name="shield" class="text-blue"></ion-icon>
      <h3>Insurance details</h3>
      <p>Update deposit info</p>
    </div>
    
    <!-- Card 5 -->
    <div class="suggestion-card">
      <ion-icon name="calendar-number-outline" class="text-blue"></ion-icon>
      <h3>Holiday calendar</h3>
      <p>Year-to-date total</p>
    </div>
    
    <!-- Card 6 -->
    <div class="suggestion-card">
      <ion-icon name="document-text-outline" class="text-blue"></ion-icon>
      <h3>2026 Tax docs</h3>
      <p>Check next review</p>
    </div>
  </div>
  
  <div style="height: 100px;"></div>

  <!-- Bottom Input area fixed to viewport via CSS -->
  <div class="input-area-fixed">
    <div class="chat-input-wrapper">
      <ion-icon name="sparkles" class="sparkle-icon"></ion-icon>
      <input type="text" placeholder="Ask me about work..." />
    </div>
  </div>

</ion-content>
