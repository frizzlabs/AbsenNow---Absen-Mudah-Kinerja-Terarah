<ion-content>
  <div class="px-5">
    <app-page-header title="Feedback" [showBack]="true"></app-page-header>
    
    <div class="pb-24">
      <h2 class="section-title">Performance Cycle {{ period }}</h2>

      <!-- Summary Card -->
      <div class="summary-card mb-4">
        <div class="summary-item">
          <span class="summary-label">Total</span>
          <span class="summary-value text-dark">{{ stats.total }}</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-item">
          <span class="summary-label text-primary">Manager</span>
          <span class="summary-value text-success">{{ stats.manager }}</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-item">
          <span class="summary-label text-primary">Peer</span>
          <span class="summary-value text-primary">{{ stats.peer }}</span>
        </div>
      </div>

      <!-- Feedback List -->
      <div class="feedback-list">
        <app-feedback-card *ngFor="let fb of feedbacks"
          [name]="fb.name"
          [role]="fb.role"
          [type]="fb.type"
          [time]="fb.time"
          [text]="fb.text"
          [status]="fb.status"
          [showAction]="fb.showAction"
          [borderClass]="fb.borderClass"
          [link]="fb.link"
          [queryParams]="fb.queryParams">
        </app-feedback-card>
      </div>

      <div class="text-center" *ngIf="!isLoading && feedbacks.length === 0" style="padding: 32px; color: var(--ion-color-medium);">
        <p>Belum ada feedback untuk periode ini.</p>
      </div>
    </div>
  </div>
  
  <app-bottom-nav></app-bottom-nav>
</ion-content>
