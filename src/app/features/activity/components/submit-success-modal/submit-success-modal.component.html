<ion-content class="ion-padding text-center">
  <div class="success-container">
    <div class="success-icon-wrapper">
      <div class="success-icon">
        <ion-icon name="checkmark"></ion-icon>
      </div>
    </div>

    <h1 class="text-h2 mt-4 mb-2">Timesheet Berhasil<br>Dikirim</h1>
    
    <p class="text-body-medium-regular text-medium mb-4">
      Timesheet Anda untuk <span class="text-dark font-medium">22 Feb - 28 Feb</span> telah diteruskan untuk persetujuan.
    </p>

    <div class="hours-card mt-4 mb-4">
      <span class="text-body-small-regular text-medium block">Total Jam Tercatat</span>
      <div class="hours-val mt-2">
        <span class="big-hours">40:00</span>
        <span class="hrs-text">jam</span>
      </div>
    </div>

    <div class="badge-wrapper mb-5">
      <div class="status-badge pending">
        <div class="dot"></div>
        Menunggu Persetujuan
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border ion-padding pb-4">
  <ion-button expand="block" shape="round" color="primary" class="mb-3" (click)="backToActivity()">
    Kembali ke Aktivitas
  </ion-button>
  <ion-button expand="block" shape="round" fill="outline" color="primary" (click)="goToApproval()">
    Lihat Persetujuan
  </ion-button>
</ion-footer>
