<ion-content>
  <app-page-header title="Edit Activity Log"></app-page-header>
  <div class="content-wrapper">
    
    <!-- Warning Alert -->
    <div class="alert-box info-alert">
      <ion-icon name="information-circle-outline"></ion-icon>
      <div class="alert-text">This record has been finalized and synced with the central timesheet system.</div>
    </div>

    <!-- Activity Title -->
    <div class="form-group">
      <div class="label">Activity Title</div>
      <div class="input-wrapper">
        <ion-icon name="document-text-outline" class="prefix-icon"></ion-icon>
        <input type="text" [(ngModel)]="title">
      </div>
    </div>

    <!-- Project or Client -->
    <div class="form-group">
      <div class="label">Project or Client</div>
      <div class="input-wrapper">
        <ion-icon name="business-outline" class="prefix-icon"></ion-icon>
        <input type="text" [(ngModel)]="project" placeholder="e.g. Project Alpha">
      </div>
    </div>

    <!-- Date -->
    <div class="form-group">
      <div class="label">Date</div>
      <div class="input-wrapper">
        <ion-icon name="calendar-outline" class="prefix-icon"></ion-icon>
        <input type="date" [(ngModel)]="activityDate">
      </div>
    </div>

    <div class="divider"></div>

    <!-- Time Selection -->
    <div class="time-row">
      <div class="form-group flex-1">
        <div class="label">Start Time</div>
        <div class="time-select">
          <input type="time" [(ngModel)]="startTime" style="border: none; outline: none; background: transparent; width: 100%;">
        </div>
      </div>
      <div class="form-group flex-1">
        <div class="label">End Time</div>
        <div class="time-select">
          <input type="time" [(ngModel)]="endTime" style="border: none; outline: none; background: transparent; width: 100%;">
        </div>
      </div>
    </div>

    <!-- Total Duration -->
    <div class="duration-row">
      <span class="duration-label">Total Duration</span>
      <div class="duration-badge">
        <ion-icon name="time-outline"></ion-icon>
        {{ durationLabel }}
      </div>
    </div>

    <div class="divider"></div>

    <!-- Category -->
    <div class="form-group">
      <div class="label">Category</div>
      <div class="pill-group">
        <div class="filter-pill" *ngFor="let cat of categories" [class.active]="category === cat.value" (click)="selectCategory(cat.value)">
          <ion-icon [name]="cat.icon"></ion-icon>
          {{ cat.label }}
        </div>
      </div>
    </div>

    <div class="divider pt-16"></div>

    <!-- Description -->
    <div class="form-group pt-16">
      <div class="label">Description</div>
      <div class="textarea-wrapper">
        <textarea [(ngModel)]="description" maxlength="200" rows="7"></textarea>
        <div class="char-count">{{ description.length }}/200 <span class="resize-handle">//</span></div>
      </div>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-wrapper">
    <ion-button expand="block" color="primary" class="save-btn" (click)="update()">
      Update Log
    </ion-button>
  </div>
</ion-footer>
