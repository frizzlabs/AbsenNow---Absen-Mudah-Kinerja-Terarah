<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline" color="dark"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Create Request</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light">
  <app-expense-stepper [currentStep]="4" [totalSteps]="5" title="Expense Request"></app-expense-stepper>

  <div class="content-wrapper">
    <h1 class="page-title">Review Expense Summary</h1>
    
    <div class="amount-display">
      {{ draft?.amount | currency:'USD':'symbol':'1.2-2' }}
    </div>

    <div class="data-card">
      <div class="data-row">
        <div class="label">Merchant</div>
        <div class="value">{{ draft?.merchant }}</div>
      </div>
      <div class="data-row">
        <div class="label">Category</div>
        <div class="value">{{ getCategoryName(draft?.category) }}</div>
      </div>
      <div class="data-row">
        <div class="label">Date</div>
        <div class="value">{{ draft?.expense_date }}</div>
      </div>
      <div class="data-row">
        <div class="label">Notes</div>
        <div class="value">{{ draft?.notes || 'No description provided' }}</div>
      </div>
    </div>

    <div class="attached-section" *ngIf="draft?.receipt_name">
      <div class="section-title">Attached Receipt</div>
      <app-expense-receipt-preview
        [imageUrl]="draft?.receipt || 'assets/images/receipt-placeholder.jpg'"
        [fileName]="draft?.receipt_name || ''"
        [fileSize]="draft?.receipt_size || ''"
        [showClose]="false">
      </app-expense-receipt-preview>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="submit-btn" (click)="submit()">
      Submit Request
    </ion-button>
  </div>
</ion-footer>
