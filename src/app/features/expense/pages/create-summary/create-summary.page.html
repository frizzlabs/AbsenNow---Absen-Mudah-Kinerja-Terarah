<app-bottom-nav></app-bottom-nav>
<ion-content color="light">
  <app-page-header [title]="'Create Request' | translate"></app-page-header>
  <app-expense-stepper [currentStep]="4" [totalSteps]="5" title="Pengajuan Pengeluaran"></app-expense-stepper>

  <div class="content-wrapper">
    <h1 class="page-title">Tinjau Ringkasan Pengeluaran</h1>
    
    <div class="amount-display">
      {{ draft?.amount | currency:'IDR':'symbol':'1.0-0' }}
    </div>

    <div class="data-card">
      <div class="data-row">
        <div class="label">Merchant</div>
        <div class="value">{{ draft?.merchant }}</div>
      </div>
      <div class="data-row">
        <div class="label">Kategori</div>
        <div class="value">{{ getCategoryName(draft?.category) }}</div>
      </div>
      <div class="data-row">
        <div class="label">Tanggal</div>
        <div class="value">{{ draft?.expense_date }}</div>
      </div>
      <div class="data-row">
        <div class="label">Catatan</div>
        <div class="value">{{ draft?.notes || 'Tidak ada deskripsi' }}</div>
      </div>
    </div>

    <div class="attached-section" *ngIf="draft?.receipt_name">
      <div class="section-title">Lampiran Tanda Terima</div>
      <app-expense-receipt-preview
        [imageUrl]="draft?.receipt || 'assets/images/receipt-placeholder.jpg'"
        [fileName]="draft?.receipt_name || ''"
        [fileSize]="draft?.receipt_size || ''"
        [showClose]="false">
      </app-expense-receipt-preview>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="submit-btn" (click)="submit()">
      Kirim Pengajuan
    </ion-button>
  </div>
</ion-footer>
