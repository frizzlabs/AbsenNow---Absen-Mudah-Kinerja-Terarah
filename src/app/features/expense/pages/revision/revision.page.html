<ion-content color="light">
  <app-page-header title="Revision Requested"></app-page-header>
  <div class="content-wrapper">
    
    <div class="comment-card">
      <div class="comment-header">
        <div class="avatar">AJ</div>
        <div class="name">Alex Johnson</div>
      </div>
      <p class="comment-text">Please attach the itemized receipt. The current one only shows the credit card total.</p>
    </div>

    <div class="form-group">
      <div class="input-label">Merchant Name</div>
      <div class="custom-input">
        <ion-input type="text" [(ngModel)]="merchantName"></ion-input>
      </div>
    </div>

    <div class="form-group">
      <div class="input-label">Date of Expense</div>
      <div class="custom-input">
        <ion-input type="text" [(ngModel)]="expenseDate"></ion-input>
        <ion-icon name="calendar-outline" class="input-icon"></ion-icon>
      </div>
    </div>

    <div class="form-group">
      <div class="input-label">Total Amount</div>
      <div class="currency-input-wrapper">
        <div class="currency-prefix">IDR</div>
        <div class="custom-input currency-input">
          <ion-input type="number" [(ngModel)]="amount"></ion-input>
        </div>
      </div>
    </div>

    <div class="form-group">
      <div class="input-label">Category</div>
      <div class="custom-input">
        <ion-input type="text" [(ngModel)]="category"></ion-input>
        <ion-icon name="chevron-down-outline" class="input-icon"></ion-icon>
      </div>
    </div>

    <div class="form-group">
      <div class="input-label">Notes</div>
      <div class="custom-textarea">
        <ion-textarea rows="3" [(ngModel)]="notes"></ion-textarea>
      </div>
    </div>

    <div class="section-title">Attached Receipt</div>
    <div class="receipt-wrapper">
      <app-expense-receipt-preview
        imageUrl="assets/images/receipt-placeholder.jpg"
        fileName="Receipt_The Corner Bistro.jpg"
        fileSize="1.2 MB"
        [showClose]="true">
      </app-expense-receipt-preview>
    </div>

    <div class="add-attachment-btn">
      <ion-icon name="add-outline"></ion-icon>
      Add Attachment
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="update-btn" (click)="updateRequest()">
      Update Request
    </ion-button>
  </div>
</ion-footer>
