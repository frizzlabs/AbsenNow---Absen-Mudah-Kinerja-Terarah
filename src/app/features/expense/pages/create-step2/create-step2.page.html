<ion-content color="light">
  <app-page-header title="Create Request"></app-page-header>
  <app-expense-stepper [currentStep]="2" [totalSteps]="5" title="Expense Request"></app-expense-stepper>

  <div class="content-wrapper">
    <h1 class="page-title">Upload Expense Receipt</h1>
    <p class="page-desc">Upload a clear photo or PDF of your receipt. Our AI will automatically extract the details.</p>

    <div class="upload-box">
      <div class="upload-icon">
        <ion-icon name="cloud-upload-outline"></ion-icon>
      </div>
      <div class="upload-text">Click to upload</div>
      <div class="upload-subtext">PDF, JPG or PNG (MAX. 5MB)</div>
    </div>

    <div class="attached-section">
      <div class="section-header">
        <div class="section-title">Attached Receipt</div>
        <div class="verified-badge">
          <ion-icon name="sparkles"></ion-icon>
          AI Verified
        </div>
      </div>
      
      <app-expense-receipt-preview
        imageUrl="assets/images/receipt-placeholder.jpg"
        fileName="Receipt_The Corner Bistro.jpg"
        fileSize="1.2 MB"
        [showClose]="true">
      </app-expense-receipt-preview>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="continue-btn" (click)="next()">
      <ion-icon name="sparkles" slot="start"></ion-icon>
      Process Receipt
    </ion-button>
  </div>
</ion-footer>
