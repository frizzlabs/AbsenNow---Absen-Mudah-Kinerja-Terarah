<ion-content color="light" class="ion-padding">
  <app-page-header [title]="'Expense Overview' | translate"></app-page-header>

  <div *ngIf="isLoading" style="display:flex;justify-content:center;align-items:center;height:240px">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <ng-container *ngIf="!isLoading">
    <app-expense-stat-card
      [totalAmount]="totalAmount"
      [pendingAmount]="pendingAmount"
      [approvedAmount]="approvedAmount">
    </app-expense-stat-card>

    <div class="section-header">
      <h2 class="section-title">Pengajuan Saat Ini</h2>
      <div class="view-all" (click)="goToHistory()">Lihat Riwayat</div>
    </div>

    <div class="requests-list">
      <div *ngIf="currentRequests.length === 0" style="text-align:center;color:#98A2B3;padding:48px 16px;font-size:14px">
        Belum ada pengajuan pengeluaran
      </div>
      <app-expense-card
        *ngFor="let req of currentRequests"
        [title]="req.title"
        [category]="req.category"
        [date]="req.date"
        [amount]="req.amount"
        [status]="req.status"
        [icon]="req.icon"
        [iconColor]="req.iconColor">
      </app-expense-card>
    </div>
  </ng-container>

  <div class="bottom-spacer"></div>
</ion-content>

<div class="floating-btn-container">
  <app-button variant="primary" icon="add-outline" iconPosition="left" class="create-btn" (onClick)="goToCreate()">
    Buat Pengajuan Pengeluaran
  </app-button>
</div>
