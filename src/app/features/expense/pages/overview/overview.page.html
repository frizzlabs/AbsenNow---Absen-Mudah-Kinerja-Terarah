<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline" color="dark"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Expense Overview</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="ion-padding">
  
  <div class="text-center" *ngIf="isLoading" style="padding: 40px; text-align: center;">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p style="color: var(--ion-color-medium); margin-top: 12px;">Loading expense details...</p>
  </div>

  <div *ngIf="!isLoading">
    <app-expense-stat-card
      [totalAmount]="totalAmount"
      [growthPercentage]="12"
      [pendingAmount]="pendingAmount"
      [approvedAmount]="approvedAmount">
    </app-expense-stat-card>

    <div class="section-header">
      <h2 class="section-title">Current Requests</h2>
      <div class="view-all" (click)="goToHistory()">View History</div>
    </div>

    <div *ngIf="currentRequests.length === 0" style="padding: 24px; text-align: center; color: var(--ion-color-medium); background: white; border-radius: 12px; border: 1px dashed var(--ion-color-medium-light); margin-bottom: 24px;">
      <ion-icon name="document-text-outline" style="font-size: 32px; margin-bottom: 8px; color: var(--ion-color-medium-light);"></ion-icon>
      <p style="margin: 0; font-size: 14px;">No expense claims found.</p>
    </div>

    <div class="requests-list" *ngIf="currentRequests.length > 0">
      <app-expense-card
        *ngFor="let req of currentRequests"
        [title]="req.title"
        [category]="req.category"
        [date]="req.date"
        [amount]="req.amount"
        [status]="req.status"
        [icon]="req.icon"
        [iconColor]="req.iconColor"
        (click)="goToDetail(req.id)">
      </app-expense-card>
    </div>
  </div>

  <div class="bottom-spacer"></div>
</ion-content>

<div class="floating-btn-container">
  <ion-button expand="block" shape="round" color="primary" class="create-btn" (click)="goToCreate()">
    <ion-icon name="add-outline" slot="start"></ion-icon>
    Create Expense Request
  </ion-button>
</div>
