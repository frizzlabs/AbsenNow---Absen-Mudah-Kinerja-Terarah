<app-bottom-nav></app-bottom-nav>
<ion-content>
  <app-page-header title="{{ role?.label || 'Privilege' }}"></app-page-header>

  <div class="text-center" *ngIf="isLoading" style="padding:40px;">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <div class="wrap" *ngIf="!isLoading">
    <div class="role-head">
      <div class="role-name">{{ role?.label }}</div>
      <div class="role-desc">{{ role?.description }}</div>
      <div class="count-badge">{{ selectedCount }} privilege aktif</div>
    </div>

    <div class="superadmin-note" *ngIf="isSuperadmin">
      <ion-icon name="information-circle-outline"></ion-icon>
      Super Admin selalu memiliki akses penuh ke semua modul (tidak dapat diubah).
    </div>

    <div class="module-card" *ngFor="let m of modules">
      <div class="module-head" (click)="toggleModule(m)">
        <span class="module-label">{{ m.label }}</span>
        <div class="module-toggle" [class.on]="moduleAllChecked(m)" [class.disabled]="isSuperadmin">
          {{ moduleAllChecked(m) ? 'Semua' : 'Pilih' }}
        </div>
      </div>
      <div class="action-list">
        <label class="action-row" *ngFor="let p of m.permissions" (click)="$event.preventDefault(); toggle(p.id)">
          <span class="action-label">{{ p.action_label }}</span>
          <ion-checkbox [checked]="selected[p.id]" [disabled]="isSuperadmin" (click)="$event.preventDefault()"></ion-checkbox>
        </label>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border" *ngIf="!isLoading && !isSuperadmin">
  <div class="footer-wrap">
    <ion-button expand="block" shape="round" color="primary" [disabled]="isSaving" (click)="save()">
      <ion-icon name="save-outline" slot="start"></ion-icon>
      Simpan Privilege
    </ion-button>
  </div>
</ion-footer>
