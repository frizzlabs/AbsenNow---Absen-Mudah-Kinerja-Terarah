<app-bottom-nav></app-bottom-nav>
<ion-content>
  <app-page-header title="Role & Privilege"></app-page-header>

  <div class="text-center" *ngIf="isLoading" style="padding:40px;">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <div class="wrap" *ngIf="!isLoading">
    <p class="hint">Atur privilege tiap role. Centang/uncentang akses per modul.</p>

    <div class="role-card" *ngFor="let r of roles" (click)="openRole(r)">
      <div class="role-icon">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
      </div>
      <div class="role-info">
        <div class="role-name">{{ r.label }}</div>
        <div class="role-desc">{{ r.description }}</div>
        <div class="role-meta">
          <span><ion-icon name="key-outline"></ion-icon> {{ r.permissions_count }} privilege</span>
          <span><ion-icon name="person-outline"></ion-icon> {{ r.users_count }} pengguna</span>
        </div>
      </div>
      <ion-icon name="chevron-forward-outline" class="chev"></ion-icon>
    </div>

    <div class="users-link" (click)="goUsers()">
      <ion-icon name="people-outline"></ion-icon>
      <span>Kelola Pengguna & Assign Role</span>
      <ion-icon name="chevron-forward-outline" class="chev"></ion-icon>
    </div>
  </div>
</ion-content>
