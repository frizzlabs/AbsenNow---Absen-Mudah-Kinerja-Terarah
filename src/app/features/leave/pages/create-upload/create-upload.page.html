<ion-content color="light">
  <app-page-header title="Upload Supporting Documents"></app-page-header>
  <app-leave-stepper [currentStep]="4" [totalSteps]="6" rightText="Request Leave"></app-leave-stepper>

  <div class="content-wrapper">
    <h1 class="page-title">Upload Supporting Documents</h1>
    <p class="page-description">Please upload your medical certificate or other relevant documents. This step is optional.</p>

    <div class="upload-box">
      <div class="icon-circle">
        <ion-icon name="cloud-upload-outline"></ion-icon>
      </div>
      <div class="upload-title">Click to upload</div>
      <div class="upload-subtitle">PDF, JPG or PNG (MAX. 5MB)</div>
    </div>

    <div class="info-alert">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <div class="alert-text">
        If you don't have the document ready, you can skip this step and upload it later from your request history.
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="continue-btn" (click)="continue()">
      Continue
    </ion-button>
  </div>
</ion-footer>
