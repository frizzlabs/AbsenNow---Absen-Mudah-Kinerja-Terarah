<ion-content color="light">
  <app-page-header [title]="'Upload Supporting Documents' | translate"></app-page-header>
  <app-leave-stepper [currentStep]="4" [totalSteps]="6" [rightText]="'leave.requestLeaveTitle' | translate"></app-leave-stepper>

  <div class="content-wrapper">
    <h1 class="page-title">{{ 'Upload Supporting Documents' | translate }}</h1>
    <p class="page-description">{{ 'leave.uploadDescription' | translate }}</p>

    <div class="upload-box" (click)="triggerFileInput(fileInput)">
      <input type="file" #fileInput style="display: none;" accept="image/*,application/pdf" (change)="onFileSelected($event)" />
      
      <div *ngIf="!fileName" class="upload-placeholder" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div class="icon-circle">
          <ion-icon name="cloud-upload-outline"></ion-icon>
        </div>
        <div class="upload-title">{{ 'leave.clickToUpload' | translate }}</div>
        <div class="upload-subtitle">{{ 'leave.uploadSubtitle' | translate }}</div>
      </div>

      <div *ngIf="fileName" class="uploaded-file-info" (click)="$event.stopPropagation()">
        <div class="icon-circle success">
          <ion-icon name="document-text-outline"></ion-icon>
        </div>
        <div class="upload-title" style="text-align: center; word-break: break-all; padding: 0 16px;">{{ fileName }}</div>
        <div class="upload-subtitle" *ngIf="fileSizeText">{{ fileSizeText }}</div>
        <ion-button fill="clear" color="danger" size="small" (click)="removeFile()" style="margin-top: 12px;">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </div>
    </div>

    <div class="info-alert">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <div class="alert-text">
        {{ 'leave.uploadSkipAlert' | translate }}
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="continue-btn" (click)="continue()">
      {{ 'leave.continue' | translate }}
    </ion-button>
  </div>
</ion-footer>
