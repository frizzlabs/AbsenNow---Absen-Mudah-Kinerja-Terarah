<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline" color="dark"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Leave History</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light">
  <div class="content-wrapper">
    
    <div *ngIf="isLoading" style="display: flex; justify-content: center; align-items: center; padding: 48px 0;">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>

    <div *ngIf="!isLoading && groups.length === 0" class="empty-state" style="text-align: center; padding: 48px 16px; color: var(--ion-color-medium);">
      <ion-icon name="calendar-outline" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5; color: var(--ion-color-primary);"></ion-icon>
      <p style="font-size: 14px; font-weight: 500;">No leave requests found.</p>
    </div>

    <div *ngFor="let group of groups">
      <div class="group-header">{{ group.monthYear }}</div>
      
      <app-leave-history-card *ngFor="let req of group.requests"
        [iconName]="getIconName(req.leave_type)"
        [iconColorClass]="getIconColorClass(req.leave_type)"
        [title]="getLeaveTypeName(req.leave_type)"
        [subtitle]="req.reason || 'No details specified'"
        [status]="req.status"
        [duration]="formatDuration(req)"
        [totalDays]="formatTotalDays(req.total_days)">
      </app-leave-history-card>
    </div>

  </div>
</ion-content>
