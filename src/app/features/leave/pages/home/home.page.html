<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline" color="dark"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Leave</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light">
  <div class="content-wrapper">
    <div class="section-title">Leave Balance</div>
    
    <div class="balance-grid">
      <div class="grid-col">
        <app-leave-balance-card
          title="Annual Leave"
          subtitle="Yearly quota"
          [daysLeft]="12"
          [usedDays]="8"
          [totalDays]="20"
          colorClass="primary">
        </app-leave-balance-card>
      </div>
      <div class="grid-col">
        <app-leave-balance-card
          title="Sick Leave"
          subtitle="Medical care"
          [daysLeft]="5"
          [usedDays]="2"
          [totalDays]="7"
          colorClass="danger">
        </app-leave-balance-card>
      </div>
    </div>

    <div class="full-card">
      <div class="icon-box">
        <ion-icon name="calendar-outline"></ion-icon>
      </div>
      <div class="content">
        <div class="label">Total Allocated</div>
        <div class="value">20 Days</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-header">
          <ion-icon name="checkmark-circle-outline" class="text-success"></ion-icon>
          <span>USED DAYS</span>
        </div>
        <div class="stat-value">8 Days</div>
      </div>
      <div class="stat-card">
        <div class="stat-header">
          <ion-icon name="time-outline" class="text-warning"></ion-icon>
          <span>PENDING</span>
        </div>
        <div class="stat-value">0 Days</div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">Current Requests</div>
      <div class="view-history" (click)="viewHistory()">View History</div>
    </div>

    <app-leave-request-card
      month="Feb"
      day="24"
      title="Annual Leave"
      subtitle="Feb 24 - Feb 25 (2 days)"
      status="pending">
    </app-leave-request-card>

    <app-leave-request-card
      month="Nov"
      day="01"
      title="Remote Work"
      subtitle="Nov 01 (1 day)"
      status="approved">
    </app-leave-request-card>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="request-btn" (click)="requestLeave()">
      <ion-icon name="add-outline" slot="start"></ion-icon>
      Request leave
    </ion-button>
  </div>
</ion-footer>
