<ion-content color="light">
  <app-page-header title="Leave"></app-page-header>
  <div class="content-wrapper">
    <div class="section-title">Leave Balance</div>
    
    <div *ngIf="isLoading" style="display:flex;justify-content:center;padding:32px 0">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>

    <ng-container *ngIf="!isLoading">
      <div class="balance-grid">
        <div class="grid-col" *ngFor="let bal of balances">
          <app-leave-balance-card
            [title]="bal.leave_type"
            subtitle="Kuota tahunan"
            [daysLeft]="bal.allocated - bal.used"
            [usedDays]="bal.used"
            [totalDays]="bal.allocated"
            colorClass="primary">
          </app-leave-balance-card>
        </div>
      </div>

      <div class="full-card">
        <div class="icon-box">
          <ion-icon name="calendar-outline"></ion-icon>
        </div>
        <div class="content">
          <div class="label">Total Allocated</div>
          <div class="value">{{ getAllocatedDays() }} Days</div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-header">
            <ion-icon name="checkmark-circle-outline" class="text-success"></ion-icon>
            <span>USED DAYS</span>
          </div>
          <div class="stat-value">{{ getUsedDays() }} Days</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <ion-icon name="time-outline" class="text-warning"></ion-icon>
            <span>PENDING</span>
          </div>
          <div class="stat-value">{{ getPendingRequestsCount() }} Days</div>
        </div>
      </div>

      <div class="section-header">
        <div class="section-title">Current Requests</div>
        <div class="view-history" (click)="viewHistory()">View History</div>
      </div>

      <div *ngIf="requests.length === 0" style="text-align:center;color:#98A2B3;padding:24px 0;font-size:14px">
        Belum ada pengajuan cuti
      </div>

      <app-leave-request-card
        *ngFor="let req of requests.slice(0, 5)"
        [month]="formatMonth(req.start_date)"
        [day]="formatDay(req.start_date)"
        [title]="req.leave_type"
        [subtitle]="formatSubtitle(req)"
        [status]="req.status">
      </app-leave-request-card>
    </ng-container>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="request-btn" (click)="requestLeave()">
      <ion-icon name="add-outline" slot="start"></ion-icon>
      Request leave
    </ion-button>
  </div>
</ion-footer>
