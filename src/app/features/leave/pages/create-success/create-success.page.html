<ion-content color="white">
  <div class="content-wrapper">
    <div class="success-header">
      <div class="icon-circle">
        <ion-icon name="checkmark-outline"></ion-icon>
      </div>
      <h1 class="page-title">Pengajuan Cuti Dikirim</h1>
      <p class="page-description">Pengajuan {{ getLeaveTypeName(draft?.leave_type) }} Anda telah dikirim ke supervisor.</p>
    </div>

    <div class="details-card">
      <div class="detail-row">
        <div class="icon-box">
          <ion-icon name="umbrella-outline"></ion-icon>
        </div>
        <div class="detail-content">
          <div class="label">Jenis Cuti</div>
          <div class="value">{{ getLeaveTypeName(draft?.leave_type) }}</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="detail-row">
        <div class="icon-box">
          <ion-icon name="time-outline"></ion-icon>
        </div>
        <div class="detail-content">
          <div class="label">Rentang Tanggal</div>
          <div class="value">{{ formatDateRange() }}</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="detail-row">
        <div class="icon-box">
          <ion-icon name="pie-chart-outline"></ion-icon>
        </div>
        <div class="detail-content">
          <div class="label">Total Durasi</div>
          <div class="value">{{ totalDays }} Hari</div>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="primary-btn" (click)="backToActivity()">
      Kembali ke Aktivitas
    </ion-button>
    <ion-button expand="block" shape="round" fill="outline" class="secondary-btn" (click)="goToApproval()">
      Lihat Persetujuan
    </ion-button>
  </div>
</ion-footer>
