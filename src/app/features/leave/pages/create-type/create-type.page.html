<app-bottom-nav></app-bottom-nav>
<ion-content color="light">
  <app-page-header [title]="'Select Leave Type' | translate"></app-page-header>
  <app-leave-stepper [currentStep]="1" [totalSteps]="5" [rightText]="'leave.requestLeaveTitle' | translate"></app-leave-stepper>

  <div class="content-wrapper">
    <h1 class="page-title">{{ 'Select Leave Type' | translate }}</h1>

    <app-leave-radio-card
      iconName="umbrella-outline"
      iconColorClass="primary"
      title="{{ 'leave.annualLeave' | translate }}"
      [subtitle]="('leave.balance' | translate) + ': <strong>' + getRemainingDays('annual') + '</strong> ' + ('leave.remaining' | translate)"
      [selected]="selectedType === 'annual'"
      (cardSelect)="selectType('annual')">
    </app-leave-radio-card>

    <app-leave-radio-card
      iconName="medkit-outline"
      iconColorClass="warning"
      title="{{ 'leave.sickLeave' | translate }}"
      [subtitle]="('leave.balance' | translate) + ': <strong>' + getRemainingDays('sick') + '</strong> ' + ('leave.remaining' | translate)"
      [selected]="selectedType === 'sick'"
      (cardSelect)="selectType('sick')">
    </app-leave-radio-card>

    <app-leave-radio-card
      iconName="wallet-outline"
      iconColorClass="medium"
      title="{{ 'leave.unpaidLeave' | translate }}"
      [subtitle]="('leave.balance' | translate) + ': <strong>' + getRemainingDays('unpaid') + '</strong>'"
      [selected]="selectedType === 'unpaid'"
      (cardSelect)="selectType('unpaid')">
    </app-leave-radio-card>

    <div class="info-alert">
      <ion-icon name="information-circle-outline"></ion-icon>
      <div class="alert-text">
        {{ 'leave.balanceInfoAlert' | translate }}
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="continue-btn" (click)="continue()">
      {{ 'leave.continue' | translate }}
    </ion-button>
  </div>
</ion-footer>
