<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline" color="dark"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Select Leave Type</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light">
  <app-leave-stepper [currentStep]="1" [totalSteps]="6" rightText="Request Leave"></app-leave-stepper>

  <div class="content-wrapper">
    <h1 class="page-title">Select Leave Type</h1>

    <app-leave-radio-card
      iconName="umbrella-outline"
      iconColorClass="primary"
      title="Annual Leave"
      subtitle="Balance: <strong>12 Days</strong> Remaining"
      [selected]="selectedType === 'annual'"
      (cardSelect)="selectType('annual')">
    </app-leave-radio-card>

    <app-leave-radio-card
      iconName="medkit-outline"
      iconColorClass="warning"
      title="Sick Leave"
      subtitle="Balance: <strong>5 Days</strong> Remaining"
      [selected]="selectedType === 'sick'"
      (cardSelect)="selectType('sick')">
    </app-leave-radio-card>

    <app-leave-radio-card
      iconName="wallet-outline"
      iconColorClass="medium"
      title="Unpaid Leave"
      subtitle="Balance: <strong>Unlimited</strong>"
      [selected]="selectedType === 'unpaid'"
      (cardSelect)="selectType('unpaid')">
    </app-leave-radio-card>

    <div class="info-alert">
      <ion-icon name="information-circle-outline"></ion-icon>
      <div class="alert-text">
        Leave balances are updated daily. Requests exceeding your balance may require special approval.
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-pad">
    <ion-button expand="block" shape="round" color="primary" class="continue-btn" (click)="continue()">
      Continue
    </ion-button>
  </div>
</ion-footer>
