<div class="file-card">
  <div class="icon-box">
    <ion-icon [name]="iconName"></ion-icon>
  </div>
  
  <div class="content">
    <div class="file-name">{{ fileName }}</div>
    <div class="file-meta">{{ fileSize }} &bull; {{ fileType }}</div>
  </div>

  <div class="action-icon">
    <ion-icon name="eye-outline"></ion-icon>
  </div>
</div>
