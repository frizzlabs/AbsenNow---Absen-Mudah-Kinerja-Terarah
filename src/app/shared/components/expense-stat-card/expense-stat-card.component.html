<div class="stat-card">
  <div class="top-section">
    <div class="label">Total submitted this month</div>
    <div class="total-amount">{{ totalAmount | currency:'USD':'symbol':'1.2-2' }}</div>
    <div class="growth-badge" [ngClass]="growthPercentage >= 0 ? 'positive' : 'negative'">
      <ion-icon [name]="growthPercentage >= 0 ? 'trending-up-outline' : 'trending-down-outline'"></ion-icon>
      {{ growthPercentage >= 0 ? '+' : ''}}{{ growthPercentage }}% vs last month
    </div>
  </div>
  <div class="bottom-section">
    <div class="stat-half">
      <div class="icon-wrapper pending">
        <ion-icon name="time-outline"></ion-icon>
      </div>
      <div class="sub-label">Pending</div>
      <div class="sub-amount">{{ pendingAmount | currency:'USD':'symbol':'1.2-2' }}</div>
    </div>
    <div class="divider"></div>
    <div class="stat-half">
      <div class="icon-wrapper approved">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </div>
      <div class="sub-label">Approved</div>
      <div class="sub-amount">{{ approvedAmount | currency:'USD':'symbol':'1.2-2' }}</div>
    </div>
  </div>
</div>
