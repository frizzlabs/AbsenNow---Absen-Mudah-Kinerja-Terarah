<div class="stepper-container">
  <div class="header">
    <div class="step-text">Langkah {{ currentStep }} dari {{ totalSteps }}</div>
    <div class="title-text">{{ title }}</div>
  </div>
  <div class="progress-track">
    <div class="progress-fill" [style.width]="progressPercent + '%'"></div>
  </div>
</div>
