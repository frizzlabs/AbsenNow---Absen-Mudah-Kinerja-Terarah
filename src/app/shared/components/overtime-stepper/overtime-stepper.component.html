<!-- Mobile: compact progress bar -->
<div class="stepper-mobile">
  <div class="stepper-header">
    <span class="step-text">Langkah {{ currentStep }} dari {{ steps.length }}</span>
    <span class="right-text">Ajukan Lembur</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" [style.width.%]="progressPercentage"></div>
  </div>
</div>

<!-- Desktop: tab wizard -->
<div class="stepper-desktop">
  <div class="wizard-tabs">
    <div
      class="wizard-tab"
      *ngFor="let step of steps; let i = index"
      [class.completed]="isCompleted(i)"
      [class.active]="isActive(i)"
      [class.clickable]="isCompleted(i)"
      (click)="goToStep(i)">
      <div class="tab-number">
        <ion-icon *ngIf="isCompleted(i)" name="checkmark-outline"></ion-icon>
        <span *ngIf="!isCompleted(i)">{{ i + 1 }}</span>
      </div>
      <span class="tab-label">{{ step.label }}</span>
      <div class="tab-connector" *ngIf="i < steps.length - 1"></div>
    </div>
  </div>
</div>
