<!-- Background overlay to match the mock -->
<div class="modal-backdrop" (click)="close()"></div>

<div class="sheet-container">
  <div class="drag-indicator-container">
    <div class="drag-indicator"></div>
  </div>

  <div class="sheet-header">
    <div class="title">Shortcuts</div>
    <ion-button fill="clear" color="medium" class="close-btn" (click)="close()">
      <ion-icon name="close-outline"></ion-icon>
    </ion-button>
  </div>

  <div class="sheet-content">
    
    <!-- TIME MANAGEMENT -->
    <div class="section-label">TIME MANAGEMENT</div>
    <div class="grid-row">
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(59, 130, 246, 0.1);">
          <ion-icon name="calendar-outline" style="color: #3b82f6;"></ion-icon>
        </div>
        <span>Attendance</span>
      </div>
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(249, 115, 22, 0.1);">
          <ion-icon name="umbrella-outline" style="color: #f97316;"></ion-icon>
        </div>
        <span>Leave</span>
      </div>
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(168, 85, 247, 0.1);">
          <ion-icon name="time-outline" style="color: #a855f7;"></ion-icon>
        </div>
        <span>Overtime</span>
      </div>
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(59, 130, 246, 0.1);">
          <ion-icon name="timer-outline" style="color: #3b82f6;"></ion-icon>
        </div>
        <span>Shift</span>
      </div>
    </div>

    <!-- FINANCE -->
    <div class="section-label mt-24">FINANCE</div>
    <div class="grid-row">
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(34, 197, 94, 0.1);">
          <ion-icon name="receipt-outline" style="color: #22c55e;"></ion-icon>
        </div>
        <span>Payslip</span>
      </div>
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(6, 182, 212, 0.1);">
          <ion-icon name="wallet-outline" style="color: #06b6d4;"></ion-icon>
        </div>
        <span>Reimburse</span>
      </div>
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(99, 102, 241, 0.1);">
          <ion-icon name="cash-outline" style="color: #6366f1;"></ion-icon>
        </div>
        <span>Loan</span>
      </div>
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(16, 185, 129, 0.1);">
          <ion-icon name="cash-outline" style="color: #10b981;"></ion-icon>
        </div>
        <span>Tax</span>
      </div>
    </div>

    <!-- REQUESTS & GENERAL -->
    <div class="section-label mt-24">REQUESTS & GENERAL</div>
    <div class="grid-row">
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(236, 72, 153, 0.1);">
          <ion-icon name="people-outline" style="color: #ec4899;"></ion-icon>
        </div>
        <span>Team</span>
      </div>
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(234, 179, 8, 0.1);">
          <ion-icon name="briefcase-outline" style="color: #eab308;"></ion-icon>
        </div>
        <span>Assets</span>
      </div>
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(14, 165, 233, 0.1);">
          <ion-icon name="folder-outline" style="color: #0ea5e9;"></ion-icon>
        </div>
        <span>Docs</span>
      </div>
      <div class="grid-item">
        <div class="icon-box" style="background: rgba(100, 116, 139, 0.1);">
          <ion-icon name="options-outline" style="color: #64748b;"></ion-icon>
        </div>
        <span>Manage</span>
      </div>
    </div>

  </div>
</div>
