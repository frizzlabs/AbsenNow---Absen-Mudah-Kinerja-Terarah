<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Notifikasi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="notification-content">
  <div class="notification-container">

    <div class="text-center" *ngIf="isLoading" style="padding: 40px;">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>

    <div class="section-title" *ngIf="!isLoading && updates.length">PEMBARUAN TERBARU</div>

    <div class="card-list">
      <div class="notif-card" *ngFor="let u of updates" (click)="openUpdate(u)" style="cursor: pointer;">
        <div class="icon-box" [style.color]="updateColor(u.color)" [style.background]="updateBg(u.color)">
          <ion-icon [name]="u.icon"></ion-icon>
        </div>
        <div class="content-box">
          <div class="header-row">
            <h3 class="title text-dark">{{ u.title }}</h3>
            <span class="time text-medium">{{ relativeTime(u.time) }}</span>
          </div>
          <p class="desc text-medium">{{ u.message }}</p>
        </div>
      </div>
    </div>

    <div class="text-center" *ngIf="!isLoading && updates.length === 0" style="padding: 48px 24px; color: var(--ion-color-medium);">
      <ion-icon name="notifications-off-outline" style="font-size: 36px;"></ion-icon>
      <p style="margin-top: 8px;">Belum ada notifikasi.</p>
    </div>

    <div style="height: 100px;"></div>
  </div>

  <app-bottom-nav activeTab="notification"></app-bottom-nav>
</ion-content>
